<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Library of Korranberg</title>
<meta name="description" content="The catalog of the Library of Korranberg, Zilargo. State your subject. Take the appropriate stone. The shelves will come.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Quattrocento:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THE LIBRARY OF KORRANBERG — STYLES
   ============================================================ */

:root {
  --void:        #0a0806;
  --void-2:      #14100b;
  --stone-deep:  #1a1610;
  --stone-mid:   #2a221a;
  --stone-warm:  #3d3328;
  --stone-soft:  #524638;
  --parchment:   #f0e6d4;
  --parchment-2: #e3d6c0;
  --ink-deep:    #1a1410;
  --ink-mid:     #3a2818;
  --ink-soft:    #5a4838;
  --brass:       #c9a84c;
  --brass-bright:#e4c76b;
  --brass-dim:   #8a7340;
  --copper:      #b87333;
  --copper-soft: #d4956a;
  --gold:        #d4af37;
  --crimson:     #7a2020;
  --crimson-bright: #a94747;
  --sealed:      #8a4040;

  --font-display: 'Cinzel Decorative', serif;
  --font-heading: 'Cinzel', serif;
  --font-body:    'Cormorant Garamond', serif;
  --font-mono:    'JetBrains Mono', monospace;
  --font-block:   'Quattrocento', serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  color: var(--parchment);
  background: var(--void);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 17px;
  line-height: 1.55;
}

button { font-family: inherit; cursor: pointer; }
input { font-family: inherit; }


/* ─── ATMOSPHERIC LAYERS (subtle, persistent) ─── */

.atmosphere {
  position: fixed; inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 30% 25%, rgba(201,168,76,0.07) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 75%, rgba(184,115,51,0.05) 0%, transparent 50%),
    linear-gradient(180deg, var(--void) 0%, var(--void-2) 60%, var(--void) 100%);
}

.particles {
  position: fixed; inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 2px; height: 2px;
  background: var(--brass);
  border-radius: 50%;
  opacity: 0;
  animation: float 14s infinite ease-in-out;
}
@keyframes float {
  0%   { opacity: 0; transform: translateY(100vh) translateX(0) scale(0.4); }
  10%  { opacity: 0.5; }
  50%  { opacity: 0.25; transform: translateY(40vh) translateX(40px) scale(1); }
  90%  { opacity: 0.15; }
  100% { opacity: 0; transform: translateY(-10vh) translateX(-30px) scale(0.4); }
}


/* ─── GLOBAL FRAME ─── */

#main {
  position: relative;
  z-index: 5;
  min-height: 100vh;
}

.scene { animation: sceneIn 0.6s ease-out; }
@keyframes sceneIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}


/* ─── DESK SCENE (PELLIC) ─── */

.scene-desk {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 2rem 2rem;
}

.desk-frame {
  display: grid;
  grid-template-columns: minmax(180px, 220px) 1fr;
  gap: 3rem;
  max-width: 920px;
  width: 100%;
  align-items: start;
}

.clerk-portrait {
  width: 220px;
  aspect-ratio: 3 / 4;
  border-radius: 4px;
  background: linear-gradient(180deg, var(--stone-warm) 0%, var(--stone-deep) 100%);
  border: 1px solid var(--stone-soft);
  box-shadow:
    inset 0 0 30px rgba(0,0,0,0.4),
    0 4px 30px rgba(0,0,0,0.5);
  overflow: hidden;
  position: relative;
}
.clerk-portrait::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(201,168,76,0.08) 0%, transparent 60%);
  pointer-events: none;
}
.clerk-portrait img,
.clerk-portrait .clerk-fallback {
  width: 100%; height: 100%;
  display: block;
  object-fit: cover;
}
.clerk-fallback {
  display: flex; align-items: center; justify-content: center;
  background: var(--stone-deep);
}
.clerk-fallback svg {
  width: 70%; height: 70%;
}

.clerk-dialogue {
  padding-top: 0.5rem;
}

.clerk-name {
  font-family: var(--font-heading);
  font-size: 0.7rem;
  letter-spacing: 0.25em;
  color: var(--brass-dim);
  text-transform: uppercase;
  margin-bottom: 0.6rem;
}

.clerk-line {
  font-family: var(--font-body);
  font-size: 1.35rem;
  line-height: 1.45;
  color: var(--parchment);
  margin-bottom: 1.6rem;
  font-style: italic;
  min-height: 2em;
  transition: opacity 0.3s;
}

.clerk-prompt {
  font-size: 1rem;
  color: var(--parchment-2);
  font-style: italic;
  opacity: 0.75;
  margin: 0.8rem 0 1.4rem;
  min-height: 1.4em;
}

.intent-row {
  display: flex;
  gap: 0.6rem;
  margin: 1rem 0 1.5rem;
}

#intent-input {
  flex: 1;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--stone-soft);
  border-bottom: 1px solid var(--brass-dim);
  color: var(--parchment);
  font-size: 1.05rem;
  padding: 0.7rem 0.9rem;
  border-radius: 2px;
  outline: none;
  transition: border 0.3s, box-shadow 0.3s;
}
#intent-input:focus {
  border-color: var(--brass);
  box-shadow: 0 0 18px rgba(201,168,76,0.12);
}
#intent-input::placeholder {
  color: var(--ink-soft);
  font-style: italic;
}

.btn-primary {
  background: linear-gradient(180deg, var(--brass-dim), #604a20);
  border: 1px solid var(--brass);
  color: var(--parchment);
  font-family: var(--font-heading);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 0 1.4rem;
  border-radius: 2px;
  transition: all 0.3s;
}
.btn-primary:hover {
  background: linear-gradient(180deg, var(--brass), #806a30);
  box-shadow: 0 0 20px rgba(201,168,76,0.25);
}

.btn-ghost {
  background: transparent;
  border: 1px solid var(--stone-soft);
  color: var(--parchment-2);
  font-family: var(--font-heading);
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 0.55rem 1rem;
  border-radius: 2px;
  transition: all 0.3s;
}
.btn-ghost:hover {
  border-color: var(--brass-dim);
  color: var(--brass);
}


/* ─── STONE TRAY ─── */

.stone-tray {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.6rem;
  margin: 1.5rem 0 1.2rem;
}

.stone-card {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding: 0.7rem 0.9rem;
  background: rgba(20,16,12,0.55);
  border: 1px solid var(--stone-soft);
  border-left: 3px solid var(--stone-color, #888);
  border-radius: 2px;
  text-align: left;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  position: relative;
  overflow: hidden;
}
.stone-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--stone-color, transparent), transparent 40%);
  opacity: 0.06;
  pointer-events: none;
}
.stone-card:hover {
  border-color: var(--stone-color);
  background: rgba(30,24,18,0.7);
  transform: translateX(2px);
  box-shadow: 0 4px 18px rgba(0,0,0,0.4), inset 0 0 12px rgba(255,255,255,0.02);
}
.stone-card.suggested {
  border-color: var(--brass);
  box-shadow: 0 0 24px rgba(201,168,76,0.18);
  animation: suggestPulse 1.4s ease-out 2;
}
.stone-card.sparse {
  opacity: 0.55;
}
@keyframes suggestPulse {
  0%, 100% { box-shadow: 0 0 0 rgba(201,168,76,0); }
  50% { box-shadow: 0 0 30px rgba(201,168,76,0.35); }
}

.stone-glyph {
  width: 32px; height: 36px;
  background-image: var(--stone-image, none);
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  filter: drop-shadow(0 0 10px var(--stone-color, #999));
  flex-shrink: 0;
}

.stone-meta { min-width: 0; }
.stone-name {
  font-family: var(--font-heading);
  font-size: 0.85rem;
  letter-spacing: 0.04em;
  color: var(--parchment);
  font-weight: 600;
  margin-bottom: 0.1rem;
}
.stone-tag {
  font-family: var(--font-block);
  font-size: 0.65rem;
  color: var(--ink-soft);
  letter-spacing: 0.05em;
}

.visiting-scholar {
  font-family: var(--font-block);
  font-size: 0.65rem;
  color: var(--ink-soft);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 1rem;
  opacity: 0.8;
}

.search-link {
  margin-top: 2.5rem;
  background: transparent;
  border: none;
  color: var(--brass-dim);
  font-family: var(--font-block);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  padding: 0.5rem;
  transition: color 0.3s;
}
.search-link:hover { color: var(--brass-bright); }


/* ─── STUDY CELL ─── */

.scene-cell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 3rem 1.5rem 4rem;
  position: relative;
}

.cell-darkness {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: var(--void);
}
.cell-darkness::before,
.cell-darkness::after {
  content: '';
  position: absolute;
  inset: 0;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  transition: opacity 1.4s ease-in-out;
}
.cell-darkness::before {
  background-image: url('assets/study-cell-empty.png');
  opacity: 1;
}
.cell-darkness::after {
  background-image: url('assets/study-cell-active.png');
  opacity: 0;
}
/* when the stone is placed, swap atmospheres */
body.cell-active .cell-darkness::before { opacity: 0; }
body.cell-active .cell-darkness::after  { opacity: 1; }
/* a vignette so text remains readable over the photo */
.cell-darkness-veil {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 0%, rgba(10,8,6,0.55) 65%, rgba(10,8,6,0.85) 100%);
}

.cell-pedestal-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 1rem 0 2.5rem;
  position: relative;
}

.cell-pedestal {
  position: relative;
  width: 320px;
  height: 320px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

/* The pedestal is painted into study-cell-empty.png and study-cell-active.png,
   so we hide the DOM elements that used to draw it. The floating stone above
   still anchors over this empty container, landing on the painted pedestal. */
.pedestal-base { display: none; }
.pedestal-base::before { content: none; }
.pedestal-top { display: none; }

.floating-stone {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px; height: 130px;
  background: transparent;
  border: none;
  cursor: pointer;
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  animation: stoneHover 4s ease-in-out infinite;
  z-index: 3;
}
.floating-stone .stone-shape {
  width: 100%; height: 100%;
  background-image: var(--stone-image, none);
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
}
.floating-stone .stone-glow {
  position: absolute;
  inset: -30px;
  background: radial-gradient(circle, var(--stone-color, #c9892c) 0%, transparent 65%);
  opacity: 0.42;
  filter: blur(20px);
  animation: glowPulse 3s ease-in-out infinite;
  z-index: 1;
}
.floating-stone:hover {
  transform: translateX(-50%) scale(1.06);
}
.floating-stone.placed {
  top: 90px;
  animation: none;
}
.floating-stone.placed .stone-glow {
  opacity: 0.65;
  inset: -40px;
}

@keyframes stoneHover {
  0%, 100% { top: -10px; }
  50% { top: -2px; }
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.38; }
  50% { opacity: 0.58; }
}

.cell-instruction {
  margin-top: 1.4rem;
  font-family: var(--font-block);
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  color: var(--ink-soft);
  text-transform: uppercase;
  text-align: center;
}

.cell-college-hint {
  position: absolute;
  bottom: 0.6rem; left: 50%;
  transform: translateX(-50%);
  text-align: center;
  opacity: 0.5;
}
.cell-college-name {
  display: block;
  font-family: var(--font-display);
  font-size: 1rem;
  color: var(--brass);
  letter-spacing: 0.08em;
}
.cell-college-tag {
  display: block;
  font-family: var(--font-block);
  font-size: 0.6rem;
  color: var(--ink-soft);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 0.2rem;
}


/* ─── ALCOVES (materialized shelves) ─── */

.cell-alcoves {
  width: 100%;
  max-width: 1100px;
  min-height: 280px;
  margin: 1rem 0 2rem;
  transition: opacity 0.5s;
}
.cell-alcoves.dismissing { opacity: 0; }
.cell-alcoves.materializing .alcove-book {
  opacity: 0;
  animation: alcoveIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  animation-delay: var(--enter-delay, 0ms);
}

@keyframes alcoveIn {
  from {
    opacity: 0;
    transform: translateY(15px) scale(0.95);
    filter: blur(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

.alcove-header {
  text-align: center;
  margin-bottom: 1.5rem;
  padding: 0 1rem;
}
.alcove-label {
  font-family: var(--font-display);
  font-size: 1rem;
  color: var(--brass);
  letter-spacing: 0.1em;
  margin-bottom: 0.4rem;
}
.alcove-scold {
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-style: italic;
  color: var(--copper-soft);
  max-width: 700px;
  margin: 0 auto;
  border-left: 2px solid var(--copper);
  padding-left: 0.8rem;
  text-align: left;
}

.alcove-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0.8rem;
  padding: 0 0.5rem;
}

.alcove-book {
  display: flex;
  align-items: stretch;
  gap: 0.7rem;
  padding: 0.75rem 0.85rem;
  background: linear-gradient(180deg, rgba(40,32,24,0.55) 0%, rgba(20,16,12,0.7) 100%);
  border: 1px solid var(--stone-soft);
  border-radius: 2px;
  text-align: left;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  min-height: 92px;
}
.alcove-book:hover {
  border-color: var(--col-color, var(--brass-dim));
  transform: translateY(-2px);
  box-shadow:
    0 8px 20px rgba(0,0,0,0.4),
    0 0 0 1px var(--col-color, var(--brass-dim));
  background: linear-gradient(180deg, rgba(50,42,32,0.7) 0%, rgba(28,22,16,0.8) 100%);
}
.alcove-book.is-restricted {
  border-color: rgba(122,32,32,0.4);
}
.alcove-book.is-restricted:hover {
  border-color: var(--crimson-bright);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4), 0 0 0 1px var(--crimson-bright);
}

.alcove-spine {
  width: 12px;
  background: linear-gradient(180deg, var(--col-color, #555) 0%, rgba(0,0,0,0.4) 100%);
  border-radius: 1px;
  flex-shrink: 0;
  position: relative;
  box-shadow: inset 1px 0 0 rgba(255,255,255,0.08);
}
.spine-band {
  position: absolute;
  left: 1px; right: 1px;
  top: 25%;
  height: 2px;
  background: rgba(201,168,76,0.5);
  border-radius: 1px;
}
.spine-band.band-2 { top: 65%; opacity: 0.6; height: 1px; }

.alcove-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.alcove-title {
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--parchment);
  letter-spacing: 0.01em;
  margin-bottom: 0.2rem;
  line-height: 1.25;
}
.alcove-author {
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-style: italic;
  color: var(--ink-soft);
  margin-bottom: 0.4rem;
}
.alcove-tags {
  display: flex; gap: 0.4rem; flex-wrap: wrap;
  align-items: center;
  font-family: var(--font-block);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.alcove-restricted {
  color: var(--crimson-bright);
  border: 1px solid rgba(169,71,71,0.4);
  padding: 0.1rem 0.35rem;
  border-radius: 2px;
}
.alcove-dispatch {
  color: var(--copper-soft);
  border: 1px solid rgba(212,149,106,0.4);
  padding: 0.1rem 0.35rem;
  border-radius: 2px;
}
.alcove-year { color: var(--ink-soft); }

.alcove-empty {
  grid-column: 1 / -1;
  text-align: center;
  font-family: var(--font-body);
  font-size: 1rem;
  font-style: italic;
  color: var(--ink-soft);
  padding: 3rem 1rem;
}

.cell-controls {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 1.5rem;
}


/* ─── READING SCENE ─── */

.scene-reading {
  min-height: 100vh;
  padding: 2rem 1rem;
  background: var(--void);
}

.reading-frame {
  max-width: 780px;
  margin: 0 auto;
  background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-2) 100%);
  color: var(--ink-deep);
  border: 6px solid var(--stone-warm);
  border-radius: 2px;
  box-shadow:
    0 0 0 1px var(--stone-soft),
    0 0 60px rgba(0,0,0,0.5);
  padding: 2rem 2.5rem 2.5rem;
  position: relative;
}
.reading-frame.is-restricted {
  border-color: var(--sealed);
  box-shadow: 0 0 0 1px var(--crimson-bright), 0 0 60px rgba(60,10,10,0.4);
}

.reading-frame.is-dispatch {
  background: linear-gradient(180deg, #e8e3d6 0%, #d8d2c0 100%);
  font-family: var(--font-mono);
  border-color: var(--ink-soft);
}
.reading-frame.is-dispatch .reading-body { font-family: var(--font-mono); font-size: 0.92rem; }
.reading-frame.is-dispatch .reading-body p { text-align: left; }
.reading-frame.is-dispatch .reading-title { font-family: var(--font-heading); }
.reading-frame.is-dispatch .reading-body p:first-child::first-letter {
  font-family: var(--font-mono);
  font-size: 1em;
  float: none;
  color: var(--ink-deep);
  margin: 0; padding: 0;
}

.reading-controls {
  display: flex;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  font-family: var(--font-mono);
}
.reading-controls .btn-ghost {
  border-color: var(--ink-soft);
  color: var(--ink-mid);
  background: transparent;
}
.reading-controls .btn-ghost:hover {
  border-color: var(--copper);
  color: var(--copper);
}

.dispatch-classification {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--crimson);
  letter-spacing: 0.25em;
  margin-bottom: 0.6rem;
  border: 1px solid var(--crimson);
  padding: 0.3rem 0.6rem;
  display: inline-block;
}

.reading-header {
  border-bottom: 2px solid var(--stone-warm);
  padding-bottom: 1rem;
  margin-bottom: 1.5rem;
}

.reading-title {
  font-family: var(--font-display);
  font-size: 1.7rem;
  color: var(--ink-deep);
  letter-spacing: 0.01em;
  line-height: 1.2;
  margin-bottom: 0.6rem;
  font-weight: 700;
}

.reading-byline {
  font-family: var(--font-block);
  font-size: 0.78rem;
  color: var(--ink-soft);
  letter-spacing: 0.06em;
}
.reading-byline .reading-author { font-style: italic; color: var(--ink-mid); }
.reading-byline .reading-sep { margin: 0 0.4rem; }
.reading-byline .reading-sealed { color: var(--crimson); font-weight: 600; }

.trust-marginalia {
  background: rgba(122,32,32,0.06);
  border: 1px solid rgba(122,32,32,0.2);
  border-left: 3px solid var(--crimson);
  padding: 0.7rem 0.9rem;
  margin-bottom: 1.5rem;
  font-family: var(--font-block);
  font-size: 0.85rem;
  color: var(--ink-mid);
  font-style: italic;
}
.trust-label {
  font-family: var(--font-heading);
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  color: var(--crimson);
  text-transform: uppercase;
  font-style: normal;
  display: block;
  margin-bottom: 0.2rem;
}

.reading-body {
  font-size: 1.08rem;
  line-height: 1.75;
  color: var(--ink-deep);
}
.reading-body p {
  margin-bottom: 1rem;
  text-align: justify;
  hyphens: auto;
}
.reading-body p:first-child::first-letter {
  font-family: var(--font-display);
  font-size: 3.6rem;
  float: left;
  line-height: 0.78;
  padding-right: 0.1em;
  color: var(--copper);
  margin-top: 0.05em;
}
.reading-body h3 {
  font-family: var(--font-heading);
  font-size: 1.05rem;
  color: var(--copper);
  margin: 1.6rem 0 0.7rem;
  letter-spacing: 0.04em;
  font-weight: 700;
  border-bottom: 1px solid rgba(184,115,51,0.25);
  padding-bottom: 0.3rem;
}
.reading-body h4 {
  font-family: var(--font-heading);
  font-size: 0.95rem;
  color: var(--ink-mid);
  margin: 1.3rem 0 0.5rem;
  font-weight: 600;
}
.reading-body strong { color: var(--ink-deep); }
.reading-body em { color: var(--ink-mid); }
.reading-body .marginalia {
  font-size: 0.92rem;
  color: var(--ink-mid);
  font-style: italic;
  border-left: 3px solid var(--copper);
  padding-left: 1rem;
  margin: 1.2rem 0 1.2rem 1.5rem;
  opacity: 0.88;
}

.reading-footer {
  display: flex;
  justify-content: space-between;
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--stone-warm);
}
.reading-footer .btn-ghost {
  border-color: var(--ink-soft);
  color: var(--ink-mid);
}
.reading-footer .btn-ghost:hover {
  border-color: var(--copper);
  color: var(--copper);
}


/* ─── SEARCH OVERLAY ─── */

.search-overlay {
  position: fixed; inset: 0;
  z-index: 200;
  background: rgba(10,8,6,0.95);
  backdrop-filter: blur(10px);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 8vh;
}
.search-overlay.active { display: flex; animation: sceneIn 0.35s ease-out; }

.search-panel {
  background: linear-gradient(180deg, var(--stone-deep) 0%, var(--void-2) 100%);
  border: 1px solid var(--stone-soft);
  border-radius: 4px;
  width: 92%;
  max-width: 760px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  overflow: hidden;
}

.search-header {
  padding: 1.2rem 1.5rem;
  border-bottom: 1px solid var(--stone-soft);
  display: flex;
  gap: 0.8rem;
  align-items: center;
}
#search-input {
  flex: 1;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--stone-soft);
  border-bottom-color: var(--brass-dim);
  border-radius: 2px;
  padding: 0.7rem 1rem;
  color: var(--parchment);
  font-size: 1rem;
  outline: none;
}
#search-input:focus {
  border-color: var(--brass);
  box-shadow: 0 0 18px rgba(201,168,76,0.12);
}

.search-filters {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  padding: 0.8rem 1.5rem;
  border-bottom: 1px solid var(--stone-soft);
}
.search-filter {
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--stone-soft);
  color: var(--ink-soft);
  font-family: var(--font-heading);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.35rem 0.75rem;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.25s;
}
.search-filter:hover { color: var(--parchment); border-color: var(--stone-soft); }
.search-filter.active {
  background: rgba(201,168,76,0.12);
  border-color: var(--brass);
  color: var(--brass);
}

.search-results {
  flex: 1;
  overflow-y: auto;
  padding: 0.5rem;
}

.search-count {
  font-family: var(--font-mono, var(--font-body));
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(232,226,212,0.4);
  padding: 0.4rem 1rem 0.6rem;
  margin: 0;
  border-bottom: 1px solid rgba(232,226,212,0.06);
}

.search-result {
  width: 100%;
  display: flex;
  gap: 0.7rem;
  padding: 0.8rem 1rem;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 3px;
  text-align: left;
  cursor: pointer;
  margin-bottom: 0.2rem;
  transition: all 0.25s;
}
.search-result:hover {
  background: rgba(201,168,76,0.06);
  border-color: var(--stone-soft);
  transform: translateX(3px);
}
.search-result .result-mark {
  width: 4px;
  background: var(--col-color, var(--stone-soft));
  border-radius: 1px;
  flex-shrink: 0;
}
.search-result .result-body { flex: 1; min-width: 0; }
.result-title {
  font-family: var(--font-heading);
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--parchment);
  margin-bottom: 0.2rem;
}
.result-tag {
  display: inline-block;
  font-family: var(--font-block);
  font-size: 0.55rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.05rem 0.4rem;
  margin-left: 0.4rem;
  border-radius: 2px;
}
.tag-sealed { color: var(--crimson-bright); border: 1px solid rgba(169,71,71,0.4); }
.tag-dispatch { color: var(--copper-soft); border: 1px solid rgba(212,149,106,0.4); }
.result-meta {
  font-family: var(--font-block);
  font-size: 0.72rem;
  color: var(--ink-soft);
  font-style: italic;
}
.result-snippet {
  font-family: var(--font-body);
  font-size: 0.88rem;
  color: var(--parchment-2);
  margin-top: 0.4rem;
  line-height: 1.45;
  opacity: 0.85;
}
.result-snippet mark, .result-title mark {
  background: rgba(201,168,76,0.25);
  color: var(--brass-bright);
  padding: 0 0.15em;
}
.search-empty {
  text-align: center;
  padding: 3rem 1rem;
  font-family: var(--font-body);
  color: var(--ink-soft);
  font-style: italic;
}


/* ─── VAULT OVERLAY ─── */

.vault-overlay {
  position: fixed; inset: 0;
  z-index: 200;
  background: rgba(20,8,8,0.96);
  backdrop-filter: blur(12px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.vault-overlay.active { display: flex; animation: sceneIn 0.4s ease-out; }

.vault-panel {
  background: linear-gradient(180deg, #1a0f0f 0%, #100808 100%);
  border: 1px solid rgba(122,32,32,0.4);
  border-radius: 4px;
  max-width: 560px;
  width: 100%;
  padding: 2rem;
  box-shadow: 0 0 60px rgba(60,10,10,0.4);
  position: relative;
}

.vault-header {
  text-align: center;
  margin-bottom: 1.5rem;
}
.vault-header h2 {
  font-family: var(--font-display);
  color: var(--crimson-bright);
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  text-shadow: 0 0 20px rgba(200,50,50,0.2);
  margin-bottom: 0.4rem;
}
.vault-header p {
  font-family: var(--font-body);
  color: var(--ink-soft);
  font-size: 0.95rem;
  font-style: italic;
}

#vault-input {
  width: 100%;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(122,32,32,0.4);
  border-bottom-color: var(--crimson-bright);
  border-radius: 2px;
  padding: 0.9rem 1rem;
  color: var(--parchment);
  font-size: 1rem;
  text-align: center;
  outline: none;
  font-family: var(--font-body);
  font-style: italic;
  margin-bottom: 0.8rem;
}
#vault-input:focus {
  border-color: var(--crimson-bright);
  box-shadow: 0 0 20px rgba(200,50,50,0.18);
}

.vault-error {
  color: var(--crimson-bright);
  font-size: 0.85rem;
  font-style: italic;
  text-align: center;
  margin-top: 0.6rem;
  opacity: 0;
  transition: opacity 0.3s;
}
.vault-error.show { opacity: 1; }

.vault-actions {
  display: flex;
  gap: 0.6rem;
  justify-content: center;
  margin-top: 0.8rem;
}
.vault-actions .btn-ghost {
  border-color: rgba(122,32,32,0.5);
  color: var(--crimson-bright);
}
.vault-actions .btn-ghost:hover {
  background: rgba(122,32,32,0.1);
  border-color: var(--crimson-bright);
}

.vault-unlocked-msg {
  text-align: center;
  font-family: var(--font-body);
  color: var(--parchment-2);
  font-style: italic;
  padding: 1rem;
}


/* ─── FLASH MESSAGE ─── */

.flash-msg {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--stone-deep);
  border: 1px solid var(--brass-dim);
  color: var(--brass);
  padding: 0.7rem 1.2rem;
  border-radius: 2px;
  font-family: var(--font-heading);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  z-index: 300;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.flash-msg.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}


/* ─── SCROLLBAR ─── */

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--stone-soft);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: var(--brass-dim); }


/* ─── RESPONSIVE ─── */

@media (max-width: 720px) {
  body { font-size: 16px; }
  .desk-frame {
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }
  .clerk-portrait { width: 140px; margin: 0 auto; }
  .stone-tray {
    grid-template-columns: 1fr;
  }
  .reading-frame { padding: 1.4rem 1.2rem; }
  .reading-title { font-size: 1.4rem; }
  .reading-body { font-size: 1rem; }
  .alcove-grid { grid-template-columns: 1fr; }
  .scene-desk { padding: 2rem 1rem; }
}
</style>
</head>
<body>

<div class="atmosphere"></div>
<div class="particles" id="particles"></div>

<main id="main"></main>


<!-- ─── SEARCH OVERLAY ──────────────────────────────────────── -->

<div class="search-overlay" id="search-overlay" onclick="if(event.target===this)closeSearch()">
  <div class="search-panel" onclick="event.stopPropagation()">
    <div class="search-header">
      <input type="text" id="search-input"
             placeholder="Search title, author, or content…"
             autocomplete="off">
      <button class="btn-ghost" onclick="closeSearch()">Close</button>
    </div>
    <div class="search-filters" id="search-filters">
      <button class="search-filter active" data-college="all">All Colleges</button>
      <button class="search-filter" data-college="soladas">Soladas</button>
      <button class="search-filter" data-college="aureon">Aureon's Holt</button>
      <button class="search-filter" data-college="blackdragon">Blackdragon</button>
      <button class="search-filter" data-college="drystone">Drystone</button>
      <button class="search-filter" data-college="lyrris">Lyrris</button>
      <button class="search-filter" data-college="morridan">Morridan</button>
      <button class="search-filter" data-college="balinor">Balinor's Horn</button>
      <button class="search-filter" data-college="tabernacle">Tabernacle</button>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>


<!-- ─── VAULT OVERLAY ───────────────────────────────────────── -->

<div class="vault-overlay" id="vault-overlay" onclick="if(event.target===this)closeVault()">
  <div class="vault-panel" onclick="event.stopPropagation()">
    <div class="vault-header">
      <h2>⟐ The Codex Vault</h2>
      <p>The Aureon-tied restricted archive. Speak the passphrase, or turn back.</p>
    </div>

    <div id="vault-prompt-area">
      <input type="text" id="vault-input"
             placeholder="Speak the passphrase…"
             onkeydown="handleVaultKey(event)">
      <div class="vault-error" id="vault-error">The Vault remains sealed. The Trust has noted your attempt.</div>
      <div class="vault-actions">
        <button class="btn-ghost" onclick="attemptVault()">Speak</button>
        <button class="btn-ghost" onclick="closeVault()">Turn Back</button>
      </div>
    </div>

    <div id="vault-unlocked-area" style="display:none;">
      <p class="vault-unlocked-msg">The Vault is open to you. Sealed volumes will now appear in your alcoves and search results, marked accordingly.</p>
      <div class="vault-actions">
        <button class="btn-ghost" onclick="closeVault()">Continue</button>
      </div>
    </div>
  </div>
</div>


<!-- particles -->
<script>
(function() {
  const c = document.getElementById('particles');
  if (!c) return;
  for (let i = 0; i < 35; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 14 + 's';
    p.style.animationDuration = (10 + Math.random() * 8) + 's';
    c.appendChild(p);
  }
})();
</script>

<script src="library-data.js"></script>
<script src="library-app.js"></script>
</body>
</html>
